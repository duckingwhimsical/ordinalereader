<!DOCTYPE html>
    <html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EPUB Reader</title>
        <link href="/content/9472c86b48adfd557f98833d5e94283d61ea4fa7b8b6908b4b9dede18132f85ai0" rel="stylesheet">
        <script type="text/javascript" src="/content/c9982a12c66ed2bdd346159dc4a13c561211fd9053a56c2c073664d099dca729i0"></script>
        <style>
            #reader-content {
                line-height: 1.6;
                padding: 20px;
                max-width: 800px;
                margin: 0 auto;
            }
            #navigation {
                max-height: 300px;
                overflow-y: auto;
            }
            .chapter-link {
                cursor: pointer;
                padding: 5px 10px;
                display: block;
            }
            .chapter-link:hover {
                background-color: var(--bs-secondary-bg);
            }
            .controls {
                position: sticky;
                top: 0;
                background-color: var(--bs-body-bg);
                padding: 10px 0;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <div class="container py-4">
            <div id="reader-section">
                <div class="controls mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <button id="decrease-font" class="btn btn-sm btn-secondary">A-</button>
                            <button id="increase-font" class="btn btn-sm btn-secondary">A+</button>
                        </div>
                        <div class="btn-group">
                            <button id="theme-toggle" class="btn btn-sm btn-secondary">
                                Toggle Theme
                            </button>
                        </div>
                    </div>
                </div>
    
                <div class="row">
                    <div class="col-md-3">
                        <div id="navigation" class="list-group"></div>
                    </div>
                    <div class="col-md-9">
                        <div id="reader-content"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="/content/72355c5f23a4b1b305d07440ffac1375327bc9b0bd04a8e6e90b97e8390c00b1i0"></script>
    </body>
    </html>
