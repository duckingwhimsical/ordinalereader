<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader</title>
    <base target="_self">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https: 'unsafe-inline'; style-src 'self' https: 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;">
    <script type="text/javascript" src="staticjs/tailwind.js"></script>
    <script type="text/javascript" src="staticjs/jszip.min.js"></script>
    <script type="text/javascript" src="staticjs/opentype.min.js"></script>
    <!-- Load either templates-default.js or templates-modern.js -->
    <!-- <script type="text/javascript" src="templates-default.js"></script> -->
    <!-- For modern UI, comment out the line above and uncomment the line below -->
    <script type="text/javascript" src="templates-modern.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sepia: {
                            50: '#faf6f0',
                            100: '#f2e8d5',
                            200: '#e8d5b9',
                            300: '#d4b690',
                            400: '#b89b76',
                            500: '#8f7355',
                            600: '#735c44',
                            700: '#574532',
                            800: '#3b2e21',
                            900: '#1f1811'
                        }
                    },
                    animation: {
                        'page-turn': 'pageTurn 1.5s ease-in-out infinite',
                        'book-open': 'bookOpen 2s ease-in-out forwards'
                    }
                }
            }
        }
    </script>
    <style>
        /* Only keep these essential styles for the book loading animation */
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .book-spine {
            transform: translateZ(-25px);
        }

        .front-cover {
            transform-origin: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Add styles for both sides of the page */
        .front-cover::before,
        .front-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: inherit;
        }

        .front-cover::before {
            background-color: rgb(59 130 246); /* bg-blue-500 */
        }

        .front-cover::after {
            background-color: rgb(96 165 250); /* bg-blue-400 */
            transform: rotateY(180deg);
        }

        /* Keep the loading animation */
        @keyframes pageTurn {
            0%, 100% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(-180deg);
            }
        }

        .animate-page-turn {
            animation: pageTurn 1.5s ease-in-out infinite;
        }

        #prevPage, #nextPage {
            transition: opacity 0.3s ease-in-out;
            -webkit-transition: opacity 0.3s ease-in-out;
        }

        /* Add column-based reader styles */
        #reader-content {
            column-gap: 40px;
            -webkit-column-gap: 40px;
            column-width: 100%;
            -webkit-column-width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            -ms-overflow-style: none;
            scrollbar-width: none;
            height: calc(100vh - 8rem); /* Adjusted to account for header/footer */
            min-height: 0; /* Remove min-height constraint */
            overflow-y: hidden;
            overflow-x: scroll;
            display: block;
            box-sizing: border-box;
            position: relative;
        }

        #reader-content::-webkit-scrollbar {
            display: none;
        }

        .chapter-content {
            padding: 2rem;
            box-sizing: border-box;
            height: calc(100vh - 8rem); /* Match parent height */
            max-height: calc(100vh - 8rem); /* Match parent height */
            display: block;
            column-width: 100%;
            -webkit-column-width: 100%;
            column-gap: 40px;
            -webkit-column-gap: 40px;
            column-fill: auto;
            -webkit-column-fill: auto;
            overflow: visible;
        }

        /* Ensure proper text handling */
        .chapter-content > * {
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        .chapter-content p,
        .chapter-content div {
            margin: 1px 0;
            text-align: justify;
            break-inside: auto;
            page-break-inside: auto;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        /* Only avoid breaks for specific semantic elements */
        .chapter-content figure,
        .chapter-content img {
            break-inside: avoid;
            page-break-inside: avoid;
            margin: 1px 0;
        }

        .chapter-content h1, 
        .chapter-content h2, 
        .chapter-content h3, 
        .chapter-content h4, 
        .chapter-content h5, 
        .chapter-content h6 {
            break-after: auto;
            break-inside: auto;
            page-break-after: auto;
            page-break-inside: auto;
            margin: 1.5em 0 0.5em;
            line-height: 1.2;
        }

        /* Ensure proper list handling */
        .chapter-content ul,
        .chapter-content ol {
            break-inside: avoid;
            page-break-inside: avoid;
            padding-left: 2em;
        }

        /* Ensure proper table handling */
        .chapter-content table {
            break-inside: auto;
            page-break-inside: auto;
            margin: 1px 0;
            border-collapse: collapse;
            width: 100%;
        }

        /* Ensure proper blockquote handling  */
        .chapter-content blockquote {
            break-inside: auto;
            page-break-inside: auto;
            margin: 1px 0;
            padding-left: 1em;
            border-left: 3px solid currentColor;
            opacity: 0.8;
        }

        /* Ensure proper code block handling */
        .chapter-content pre,
        .chapter-content code {
            break-inside: auto;
            page-break-inside: auto;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            white-space: pre-wrap;
        }

        /* Ensure proper image handling */
        .chapter-content img {
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - 8rem - 4rem); /* Account for container height minus padding */
            object-fit: contain;
            display: block;
            margin: 1px auto;
            break-inside: avoid;
            page-break-inside: avoid;
        }
    </style>
    <style>
        @keyframes pageTurnBackward {
            0% {
                transform: translateX(100%) scale(0.95);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }
      
        @keyframes pageTurnForward {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-100%) scale(0.95);
                opacity: 0;
            }
        }
      
        .turn-forward {
            animation: pageTurnForward var(--page-turn-speed, 300ms) ease-in-out forwards;
        }
        
        .turn-backward {
            animation: pageTurnBackward var(--page-turn-speed, 300ms) ease-in-out forwards;
        }
      </style>
      
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 sepia:from-sepia-50 sepia:to-sepia-100 h-screen overflow-hidden transition-colors duration-300">
    <!-- Animated Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="text-center p-8 rounded-2xl bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm shadow-xl">
            <!-- Animated Book -->
            <div class="relative w-48 h-64 mx-auto mb-8 perspective-1000">
                <div class="absolute inset-0 book-spine bg-blue-600 dark:bg-blue-500 rounded-lg shadow-xl transform-style-3d">
                    <div class="absolute inset-0 front-cover bg-blue-500 dark:bg-blue-400 rounded-lg shadow-lg transform origin-left animate-page-turn">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <svg class="w-16 h-16 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Loading Book...</h3>
            <div class="w-64 h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div id="loadingProgress" class="h-full bg-blue-500 transition-all duration-300 ease-out"></div>
            </div>
            <p id="loadingStatus" class="mt-2 text-sm text-gray-600 dark:text-gray-400">Initializing...</p>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-dvh w-72 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-xl transform -translate-x-full transition-transform duration-300 ease-out z-50">
        <div class="sticky top-0 bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-white">Contents</h2>
            <button id="closeSidebar" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="p-4 space-y-6 overflow-y-auto max-h-[calc(85vh-4rem)]">
            <div class="space-y-2">
                <h3 class="text-lg font-medium text-gray-800 dark:text-white">Table of Contents</h3>
                <div id="toc" class="space-y-1"></div>
            </div>
            <div class="space-y-2">
                <h3 class="text-lg font-medium text-gray-800 dark:text-white">Bookmarks</h3>
                <div id="bookmarks" class="space-y-1"></div>
            </div>
            <div class="space-y-4">
                <h3 class="text-lg font-medium text-gray-800 dark:text-white">Settings</h3>
                <div class="space-y-4 bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl">
                    <div class="space-y-2">
                        <label for="fontSize" class="block text-sm font-medium text-gray-700 dark:text-gray-300 sepia:text-sepia-500">Font Size</label>
                        <input type="range" id="fontSize" min="12" max="24" step="1" 
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer 
                            dark:bg-gray-600 sepia:bg-sepia-200
                            accent-blue-500 dark:accent-blue-400 sepia:accent-sepia-400">
                    </div>
                    <div class="space-y-2">
                        <label for="theme" class="block text-sm font-medium text-gray-700 dark:text-gray-300 sepia:text-sepia-500">Theme</label>
                        <select id="theme" class="block w-full px-3 py-2 bg-white dark:bg-gray-700 sepia:bg-sepia-100 
                            border border-gray-300 dark:border-gray-600 sepia:border-sepia-300 
                            rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 sepia:focus:ring-sepia-400">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                            <option value="sepia">Sepia</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main" class="h-dvh flex flex-col">
        <!-- Top Header -->
        <header class="flex-none bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm shadow-sm p-4 flex justify-between items-start z-30">
            <button id="menuButton" class="flex-shrink-0 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 id="bookTitle" class="flex-1 min-w-0 text-center"></h1>
            <div class="flex space-x-2 flex-shrink-0">
                <button id="searchButton" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
                <button id="bookmarkButton" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Reader Container -->
        <div class="flex-1 min-h-0 bg-white dark:bg-gray-900 sepia:bg-sepia-50">
            <!-- Navigation Buttons -->
            <div class="absolute inset-y-0 left-0 flex items-center w-1/4 group z-20">
                <button id="prevPage" class="w-full h-full flex items-center justify-start pl-4 transition-opacity duration-300 hover:opacity-100">
                    <svg class="w-6 h-6 text-gray-900 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
            </div>
            <div class="absolute inset-y-0 right-0 flex items-center w-1/4 group z-20">
                <button id="nextPage" class="w-full h-full flex items-center justify-end pr-4 transition-opacity duration-300 hover:opacity-100">
                    <svg class="w-6 h-6 text-gray-900 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- Reader Content -->
            <div id="reader-content" class="h-full overflow-x-scroll overflow-y-hidden px-4 sm:px-8 md:px-12 lg:px-18">
                <!-- Content will be inserted here -->
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="flex-none bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm p-1 text-center border-t border-gray-200 dark:border-gray-700 z-30">
            <span id="currentPage" class="text-sm font-medium text-gray-600 dark:text-gray-400"></span>
        </div>

        <!-- Search Overlay -->
        <div id="searchOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50">
            <div class="max-w-lg mx-auto mt-20 p-6 bg-white dark:bg-gray-800 rounded-xl shadow-xl">
                <input type="text" id="searchInput" placeholder="Search..." class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                <div id="searchResults" class="mt-4 max-h-96 overflow-y-auto divide-y divide-gray-200 dark:divide-gray-700"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="app.js"></script>
</body>
</html>
